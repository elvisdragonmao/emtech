name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck blog
        run: pnpm --filter blog typecheck

      - name: Build blog
        run: pnpm --filter blog build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared package
        run: pnpm --filter @emtech/comments-shared typecheck

      - name: Test shared package
        run: pnpm --filter @emtech/comments-shared test

      - name: Typecheck comments worker
        run: pnpm --filter comments-worker typecheck

      - name: Test comments worker
        run: pnpm --filter comments-worker test

      - name: Bundle comments worker
        working-directory: apps/comments-worker
        run: pnpm exec wrangler deploy --dry-run --outdir /tmp/emtech-comments-worker
