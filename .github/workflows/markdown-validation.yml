name: 🔍 文章格式檢查

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  prettier:
    name: ✨ Prettier
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install prettier
        run: npm install -g prettier

      - name: Run prettier
        run: npx prettier --write .
        continue-on-error: true

      - name: Add and commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git restore --staged package.json .github
          git restore package.json .github
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "style: 你們為甚麼就不能記得格式化一下？"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-markdown:
    name: 📰 檢查 Markdown 檔案
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Formats
        run: |
          chmod +x .github/workflows/markdown-validation.sh
          .github/workflows/markdown-validation.sh

  winston-bot:
    name: 📰 Winston Bot 中文檢查
    runs-on: ubuntu-latest
    steps:
      - name: Winston Bot 中文檢查
        uses: elvisdragonmao/WinstonBot-CI@main
        with:
          exts: md
          github_token: ${{ secrets.GITHUB_TOKEN }}
