<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CSS 與 requestAnimationFrame 動畫效能比較</title>
		<style>
			body {
				overflow-x: hidden;
				font-family: system-ui, sans-serif;
			}

			#header {
				margin: 0 0.5rem;
				z-index: 100;
				background-color: lightgreen;
			}

			#header h1 {
				margin: 0;
				font-size: 1.25rem;
			}

			#box-container {
				margin-top: 1.5rem;
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(30px, 1fr));
				gap: 15px;
			}

			.box {
				width: 30px;
				height: 30px;
				background-color: red;
			}

			.css-animation {
				animation: animate 6s linear 0s infinite alternate;
			}

			body.motion-paused .css-animation {
				animation-play-state: paused;
			}

			@media (prefers-reduced-motion: reduce) {
				.css-animation {
					animation-play-state: paused;
				}
			}

			@keyframes animate {
				0% {
					transform: translateX(0) rotate(0deg) scale(0.6);
				}

				100% {
					transform: translateX(500px) rotate(360deg) scale(1.4);
				}
			}
		</style>
	</head>

	<body>
		<div id="header">
			<h1>動畫效能比較</h1>
			<button id="toggle-button">切換動畫實作</button>
			<button id="pause-button" aria-pressed="false">暫停動畫</button>
			<span id="type">CSS 動畫</span>
		</div>
		<div id="box-container" aria-hidden="true"></div>
		<script>
			const boxes = [];
			const button = document.getElementById("toggle-button");
			const pauseButton = document.getElementById("pause-button");
			const boxContainer = document.getElementById("box-container");
			const animationType = document.getElementById("type");
			const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

			// create boxes
			for (let i = 0; i < 1000; i++) {
				const div = document.createElement("div");
				div.classList.add("css-animation");
				div.classList.add("box");
				boxContainer.appendChild(div);
				boxes.push(div.style);
			}

			let useCssAnimation = true;
			let isPaused = reducedMotion.matches;
			let rafId;
			button.addEventListener("click", () => {
				if (useCssAnimation) {
					animationType.textContent = "requestAnimationFrame";
					for (const child of boxContainer.children) {
						child.classList.remove("css-animation");
					}
					useCssAnimation = false;
					start = null;
					if (!isPaused) rafId = window.requestAnimationFrame(animate);
				} else {
					window.cancelAnimationFrame(rafId);
					animationType.textContent = "CSS 動畫";
					for (const child of boxContainer.children) {
						child.classList.add("css-animation");
					}
					useCssAnimation = true;
				}
			});

			pauseButton.addEventListener("click", () => {
				setPaused(!isPaused);
			});

			reducedMotion.addEventListener("change", event => {
				if (event.matches) setPaused(true);
			});

			function setPaused(paused) {
				isPaused = paused;
				document.body.classList.toggle("motion-paused", isPaused);
				pauseButton.textContent = isPaused ? "播放動畫" : "暫停動畫";
				pauseButton.setAttribute("aria-pressed", String(isPaused));
				if (isPaused) {
					window.cancelAnimationFrame(rafId);
					return;
				}
				if (!useCssAnimation) {
					start = null;
					rafId = window.requestAnimationFrame(animate);
				}
			}

			const duration = 6000;
			const translateX = 500;
			const rotate = 360;
			const scale = 1.4 - 0.6;
			let start;
			function animate(time) {
				if (isPaused || useCssAnimation) return;
				if (!start) {
					start = time;
					rafId = window.requestAnimationFrame(animate);
					return;
				}

				const progress = (time - start) / duration;
				if (progress < 2) {
					let x = progress * translateX;
					let transform;
					if (progress >= 1) {
						x = (2 - progress) * translateX;
						transform = `translateX(${x}px) rotate(${(2 - progress) * rotate}deg) scale(${0.6 + (2 - progress) * scale})`;
					} else {
						transform = `translateX(${x}px) rotate(${progress * rotate}deg) scale(${0.6 + progress * scale})`;
					}

					for (const box of boxes) {
						box.transform = transform;
					}
				} else {
					start = null;
				}
				rafId = window.requestAnimationFrame(animate);
			}

			setPaused(isPaused);
		</script>
	</body>
</html>
