name = "emtech-comments-worker"
main = "src/index.ts"
compatibility_date = "2026-05-13"

[[d1_databases]]
binding = "COMMENTS_DB"
database_name = "emtech-comments"
# Run `wrangler d1 create emtech-comments`, then replace this placeholder.
database_id = "22d6a94b-a46f-491b-bf8f-9607f16cf829"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "http://localhost:4321,https://emtech.cc"
COMMENT_DEFAULT_STATUS_ANON = "approved"
COMMENT_DEFAULT_STATUS_GITHUB = "approved"
GITHUB_REDIRECT_URI = "https://api.emtech.cc/api/auth/github/callback"
BLOG_ORIGIN = "https://emtech.cc"

[[routes]]
pattern = "api.emtech.cc"
custom_domain = true

[observability]
enabled = true
